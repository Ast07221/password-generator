<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<style>
body{
    margin:0;
    font-family:system-ui;
    background:#0b0b0b;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
}
.wrapper{
    width:100%;
    max-width:760px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    box-sizing:border-box;
    position:relative;
}
.output{
    width:100%;
    max-width:580px;
    text-align:left;
}
.card{
    width:100%;
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,0.05);
}
.line{
    margin:6px 0;
    line-height:1.5;
    font-size:18px;
    word-break:break-all;
}
.label{
    color:#6f6f6f;
}
.value{
    color:#fff;
}
.password{
    font-family:monospace;
    font-size:21px;
    letter-spacing:1px;
}
.strength{
    font-size:13px;
    color:#8a8a8a;
    margin-top:4px;
}
.loader{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -120px);
    font-family:monospace;
    font-size:11px;
    letter-spacing:4px;
    color:#7a7a7a;
    opacity:.72;
    pointer-events:none;
    text-transform:uppercase;
    user-select:none;
}
.topbar{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:18px;
    align-items:center;
    flex-wrap:wrap;
    justify-content:center;
}
button{
    background:none;
    border:none;
    color:#fff;
    cursor:pointer;
    font-size:14px;
    font-weight:500;
}
button:hover{
    opacity:.7;
}
input[type="number"]{
    width:50px;
    background:none;
    border:none;
    color:#fff;
    text-align:center;
    font-size:14px;
    outline:none;
}
label{
    font-size:13px;
    color:#9a9a9a;
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
}
input[type="checkbox"]{
    accent-color:#fff;
}
.notice{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:12px;
    color:#888;
    opacity:0;
    transition:.25s;
}
.typingCursor{
    display:inline-block;
    width:1px;
    height:18px;
    background:#888;
    margin-left:4px;
    vertical-align:middle;
    animation:blink .9s infinite;
}
.hint{
    margin-top:25px;
    font-size:12px;
    color:#666;
    text-align:center;
}
.links{
    margin-top:25px;
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    justify-content:center;
    font-size:12px;
}
.links span{
    color:#777;
    cursor:pointer;
}
.links span:hover{
    color:#fff;
}
@keyframes blink{
    0%{opacity:0;}
    50%{opacity:1;}
    100%{opacity:0;}
}
</style>
</head>
<body>

<div class="notice" id="notice">copied</div>

<div class="wrapper">
    <div class="loader" id="loader">
        INITIALIZING<span class="typingCursor"></span>
    </div>

    <div class="output" id="output"></div>

    <div class="hint">
        Click generate to create secure random passwords
    </div>

    <div class="links">
        <span>Fake User Generator</span>
        <span>UUID Generator</span>
        <span>Username Generator</span>
    </div>
</div>

<div class="topbar">
    <button onclick="generatePasswords()">generate</button>
    <button onclick="copyPassword()">copy</button>
    <button onclick="clearPassword()">clear</button>

    <input id="lengthInput" type="number" value="16" min="4" max="200">

    <label><input type="checkbox" id="upper" checked>ABC</label>
    <label><input type="checkbox" id="lower" checked>abc</label>
    <label><input type="checkbox" id="numbers" checked>123</label>
    <label><input type="checkbox" id="symbols">#$%</label>
</div>

<script>
const output = document.getElementById("output");
const notice = document.getElementById("notice");
const loader = document.getElementById("loader");
let currentPassword = "";
    function showNotice(text){
    notice.textContent = text;
    notice.style.opacity = 1;
    setTimeout(() => notice.style.opacity = 0, 1200);
}

function getStrength(password){
    let score = 0;
    if(password.length >= 12) score++;
    if(password.length >= 20) score++;
    if(/[A-Z]/.test(password)) score++;
    if(/[0-9]/.test(password)) score++;
    if(/[^A-Za-z0-9]/.test(password)) score++;

    if(score <= 2) return "weak";
    if(score <= 4) return "medium";
    return "strong";
}

function createPassword(){
    const length = Math.max(4, Math.min(200, parseInt(document.getElementById("lengthInput").value) || 16));

    const upper = document.getElementById("upper").checked;
    const lower = document.getElementById("lower").checked;
    const numbers = document.getElementById("numbers").checked;
    const symbols = document.getElementById("symbols").checked;

    let chars = "";
    if(upper) chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    if(lower) chars += "abcdefghijklmnopqrstuvwxyz";
    if(numbers) chars += "0123456789";
    if(symbols) chars += "!@#$%^&*()_+-={}[]<>?/";

    if(chars.length === 0){
        chars = "abcdefghijklmnopqrstuvwxyz";
    }

    const randomValues = new Uint32Array(length);
    crypto.getRandomValues(randomValues);

    let password = "";
    for(let i=0;i<length;i++){
        password += chars[randomValues[i] % chars.length];
    }

    return password;
}

function typePasswords(passwords){
    output.innerHTML = "";

    passwords.forEach((password,index)=>{
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <div class="line">
                <span class="label">Password ${index+1}:</span>
                <span class="value password" id="p${index}"></span>
                <span class="typingCursor" id="c${index}"></span>
            </div>
            <div class="strength">Strength: ${getStrength(password)}</div>
        `;
        output.appendChild(card);

        const target = document.getElementById(`p${index}`);
        const cursor = document.getElementById(`c${index}`);

        let i = 0;
        function typeChar(){
            if(i < password.length){
                target.textContent += password[i];
                i++;
                setTimeout(typeChar, 12);
            } else {
                cursor.remove();
            }
        }

        setTimeout(typeChar, index * 250);
    });
}

function generatePasswords(){
    loader.style.display = "block";
    output.innerHTML = "";

    setTimeout(()=>{
        const passwords = [
            createPassword(),
            createPassword(),
            createPassword()
        ];

        currentPassword = passwords[0];
        loader.style.display = "none";
        typePasswords(passwords);
    }, 350);
}

function copyPassword(){
    if(!currentPassword) return;
    navigator.clipboard.writeText(currentPassword);
    showNotice("copied");
}

function clearPassword(){
    output.innerHTML = "";
    currentPassword = "";
    loader.style.display = "block";
}

window.onload = generatePasswords;
</script>

</body>
</html>
